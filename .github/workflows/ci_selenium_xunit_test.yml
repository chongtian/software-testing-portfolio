name: Selenium xUnit Tests - KidProblem
on:
  push:
    branches: [ main ]
    paths:
      - kid-problem-ui-test-selenium/KpUiTestxUnit/**
  pull_request:
    branches: [ main ]
    paths:
      - kid-problem-ui-test-selenium/KpUiTestxUnit/**    
  workflow_dispatch:  # Allows manual triggering from the Actions tab

jobs:
  test-playwright:
    environment: TEST_KIDPROBLEM

    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kid-problem-ui-test-selenium/KpUiTestxUnit

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore


    - name: Run xUnit Tests
      run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test_results.trx
      env:
        BASE_URL: ${{ vars.BASE_URL }}
        KPUITEST_ADMIN_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
        KPUITEST_ADMIN_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        KPUITEST_CHILD_USERNAME: ${{ secrets.TEST_CHILD_USERNAME }}
        KPUITEST_CHILD_PASSWORD: ${{ secrets.TEST_CHILD_PASSWORD }}

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      with:
        name: xunit-test-results
        path: 'kid-problem-ui-test-selenium/KpUiTestxUnit/**/test_results.trx'
        retention-days: 30

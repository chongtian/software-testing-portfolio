name: Playwright Tests - NSERP
on:
  pull_request:
    branches: [ main ]
    paths:
      - nserp-ui-test-playwright/**    
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:  # Allows manual triggering from the Actions tab

jobs:
  test-playwright:
    environment: TEST_NSERP

    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nserp-ui-test-playwright

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        TEST_API_URL: ${{ secrets.TEST_API_URL }}
        TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results
        path: nserp-ui-test-playwright/test-results/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: nserp-ui-test-playwright/playwright-report/
        retention-days: 30